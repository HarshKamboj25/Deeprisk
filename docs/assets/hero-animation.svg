<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#101D36"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#0EA5E9" stop-opacity=".34"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="950" cy="170" r="190" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="r" values="150;205;150" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#38BDF8" stroke-opacity=".13">
    <path d="M0 75H1200M0 145H1200M0 215H1200M0 285H1200"/>
    <path d="M100 0V360M220 0V360M340 0V360M460 0V360M580 0V360M700 0V360M820 0V360M940 0V360M1060 0V360M1180 0V360"/>
  </g>

  <g stroke="url(#accent)" stroke-width="1.4" opacity=".45">
    <path d="M700 80L820 140L930 65L1060 130L1160 70">
      <animate attributeName="stroke-opacity" values=".15;.8;.15" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M760 275L875 210L1000 285L1120 220L1190 260">
      <animate attributeName="stroke-opacity" values=".8;.15;.8" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#38BDF8">
    <circle cx="820" cy="140" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="65" r="3"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="130" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="875" cy="210" r="3"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="285" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="65" y="64" width="4" height="222" rx="2" fill="url(#accent)"/>

  <text x="95" y="105" fill="#7DD3FC" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="5">SOFTWARE SUPPLY-CHAIN SECURITY</text>
  <text x="90" y="183" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-2">DEEP RISK</text>
  <text x="95" y="225" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="19">Understand dependencies. Prioritize vulnerabilities.</text>
  <text x="95" y="252" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="19">Make security decisions with clarity.</text>

  <rect x="95" y="285" width="140" height="31" rx="15.5" fill="#0F766E" fill-opacity=".25" stroke="#2DD4BF" stroke-opacity=".6"/>
  <circle cx="112" cy="300" r="4" fill="#34D399">
    <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="125" y="305" fill="#99F6E4" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.5">LIVE PLATFORM</text>
</svg>
