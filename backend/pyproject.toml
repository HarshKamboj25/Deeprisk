[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deprisk"
version = "0.0.1"
description = "Software supply-chain vulnerability prioritization and remediation assistant"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "semantic-version>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
deprisk = "deprisk.cli:main"

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.20,<1"]
postgres = ["asyncpg>=0.29,<1"]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
